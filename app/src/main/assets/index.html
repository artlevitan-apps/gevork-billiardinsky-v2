function rules(inGame=false){let html='<ul><li>Забивайте только свои шары: <b>сплошные 1–7</b> либо <b>полосатые 9–15</b>. Первый правильно забитый при открытом столе назначает группу.</li><li>Белый биток первым касается своего шара. Если не коснулся нужного шара — соперник выставляет биток в любом месте.</li><li>После правильного первого касания нужно забить шар или довести любой шар до борта, иначе фол.</li><li>Забили свой шар без фола — играете ещё. Иначе ход соперника.</li><li>Когда все свои шары забиты, закажите лузу для <b>чёрной восьмёрки</b> и забейте её туда — победа.</li><li>Преждевременная или ошибочная восьмёрка возвращается на стол; сопернику даётся свободный биток.</li><li>← → направление · ↑ ↓ боковое вращение · удерживать OK сила удара · отпускание OK удар. Назад — пауза.</li></ul><p class="small">Домашняя адаптация правил 8-ball для игры с пульта: без сложных требований к заявлению каждого удара и без проигрыша за преждевременную восьмёрку.</p>';

function win(i){sound('pocket',2);let portrait='<img class="win-photo" src="dad.jpg">';showModal('win','Победа игрока '+(i+1)+'!',portrait+'<p><b>Геворк Бильярдинский поздравляет!</b><br>Ещё немного практики — и однажды ты станешь таким же мастером, как сам Геворк.</p>',['Ещё партия','Главное меню'],[()=>newGame(mode),()=>{close();menu()}],true)}
